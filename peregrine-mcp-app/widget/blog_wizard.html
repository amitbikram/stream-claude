<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Peregrine Blog Wizard</title>
<link rel="stylesheet" href="./blog-wizard.css" />
<style>
  :root {
    --color-text-primary: #1a1a1a;
    --color-text-secondary: #4a4a4a;
    --color-text-tertiary: #808080;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f6f6f6;
    --color-border-primary: #5a5a5a;
    --color-border-secondary: #cccccc;
    --color-border-tertiary: #e5e5e5;
    --border-radius-md: 6px;
    --border-radius-lg: 10px;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-text-primary: #f5f5f5;
      --color-text-secondary: #b8b8b8;
      --color-text-tertiary: #8a8a8a;
      --color-background-primary: #1c1c1e;
      --color-background-secondary: #28282b;
      --color-border-primary: #6a6a6a;
      --color-border-secondary: #4a4a4a;
      --color-border-tertiary: #3a3a3a;
    }
  }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
  }
</style>
</head>
<body>
<div id="bw-root"></div>
<script>
  // Bridge state from URL query param → data-state attribute. The MCP server
  // emits an iframe URL like `…/blog_wizard.html?state=<urlencoded-json>`;
  // the widget JS below hydrates from data-state on boot.
  (function(){
    try {
      var params = new URLSearchParams(window.location.search);
      var s = params.get('state');
      if (s) document.getElementById('bw-root').setAttribute('data-state', s);
    } catch (_) {}
  })();
</script>
<script src="./blog-wizard.js"></script>
</body>
</html>
